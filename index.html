<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유료방송 재산상황 비교분석 | Tcast</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script>
<style>
  :root {
    --pink1: #ec1e79; --pink2: #c2116b; --pink1-d: #c2116b; --pink2-d: #8e0e50;
    --bg: #f5f6f8; --card: #ffffff; --text: #1c1c1e; --sub: #6b6f76; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --card: #212227; --text: #f0f0f2; --sub: #a2a5ad; --border: #34363c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--pink1), var(--pink2));
    color: #fff; padding: 20px 16px; text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    header { background: linear-gradient(135deg, var(--pink1-d), var(--pink2-d)); }
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header p { margin: 6px 0 0; font-size: 12px; opacity: 0.9; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--text); }
  .filters { display: flex; flex-wrap: wrap; gap: 16px; }
  .filter-group { flex: 1; min-width: 220px; }
  .filter-group label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg); font-size: 13px; cursor: pointer; user-select: none; color: var(--text);
  }
  .chip.active { background: var(--pink1); border-color: var(--pink1); color: #fff; }
  .cat-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); font-size: 13px; cursor: pointer; color: var(--text); font-weight: 600;
  }
  .cat-btn.active { background: var(--pink1); border-color: var(--pink1); color: #fff; }
  .cat-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .group-hint { font-size: 11px; color: var(--sub); margin: -4px 0 8px; }
  select, .unit-toggle {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .unit-toggle { display: flex; gap: 6px; width: auto; }
  .unit-btn {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
    font-size: 13px; cursor: pointer; color: var(--text);
  }
  .unit-btn.active { background: var(--pink1); border-color: var(--pink1); color: #fff; }
  canvas { max-height: 380px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--sub); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  tbody tr:hover { background: rgba(236,30,121,0.06); }
  .table-wrap { max-height: 420px; overflow: auto; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 13px; }
  footer { text-align: center; padding: 24px 16px; color: var(--sub); font-size: 12px; }
  .company-color { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
</style>
</head>
<body>

<header>
  <h1>📊 유료방송 재산상황 비교분석</h1>
  <p>IPTV·SO·PP 사업자 재무 데이터 (방송미디어통신위원회 재산상황공표집 기준) · 페이지 만든이: Tcast 매체영업팀</p>
</header>

<main>
  <div class="card">
    <h2>필터</h2>
    <div class="filters">
      <div class="filter-group" style="flex-basis:100%;">
        <label>구분</label>
        <div class="cat-row" id="categoryRow"></div>
        <label>사업자 (복수 선택 가능)</label>
        <div class="group-hint" id="groupHint" style="display:none;">SO는 계열사별로 묶어서 합계로 보여드려요. 묶이지 않은 개별 케이블사업자는 "기타(개별SO)"로 합산됩니다.</div>
        <div class="chip-group" id="companyChips"></div>
      </div>
      <div class="filter-group">
        <label>항목</label>
        <select id="metricSelect"></select>
      </div>
      <div class="filter-group" style="flex: 0 0 auto; min-width: 140px;">
        <label>단위</label>
        <div class="unit-toggle">
          <button class="unit-btn active" data-unit="100000">억원</button>
          <button class="unit-btn" data-unit="1000">백만원</button>
          <button class="unit-btn" data-unit="1">천원</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="chartTitle">연도별 추이</h2>
    <canvas id="trendChart"></canvas>
  </div>

  <div class="card">
    <h2 id="tableTitle">전체 데이터</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr id="dataTableHead"></tr>
        </thead>
        <tbody id="dataTableBody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none;">데이터가 없습니다. Supabase에 SQL이 실행되었는지 확인해주세요.</div>
  </div>
</main>

<footer>Tcast 매체영업팀 · 데이터 출처: 방송미디어통신위원회 방송사업자 재산상황공표집</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const METRIC_GROUPS = {
  "매출 지표": ["매출액", "방송사업매출액", "유료방송수신료매출액", "기본채널수신료매출액", "유료채널수신료매출액",
    "유료VOD수신료매출액", "광고매출액", "홈쇼핑송출수수료매출액", "가입및시설설치매출액", "단말장치대여매출액",
    "기타방송사업매출액", "기타사업매출액"],
  "손익 지표": ["방송프로그램사용료", "영업손익", "당기순손익"],
  "재무상태": ["자산총계", "부채총계", "자본총계"]
};

const COLORS = ["#ec1e79", "#1e88e5", "#43a047", "#fb8c00", "#8e24aa", "#00acc1", "#6d4c41", "#546e7a"];

// SO 계열사 그룹핑: 상호변경(현대HCN→HCN→KT HCN 등)까지 반영해서 실제 같은 계열끼리 묶음
const SO_GROUP_ORDER = ["딜라이브", "CMB", "HCN", "LG헬로비전", "SK브로드밴드", "기타(개별SO)"];
const SO_GROUP_RULES = [
  ["딜라이브", n => n.startsWith("(주)딜라이브")],
  ["CMB", n => n.startsWith("(주)씨엠비")],
  ["HCN", n => n.startsWith("(주)에이치씨엔") || n.startsWith("(주)케이티에이치씨엔") || n.startsWith("(주)현대에이치씨엔")],
  ["LG헬로비전", n => n.startsWith("(주)엘지헬로비전")],
  ["SK브로드밴드", n => n.startsWith("에스케이브로드밴드(주)") || n === "브로드밴드노원방송"],
];
function soGroupOf(name) {
  for (const [g, test] of SO_GROUP_RULES) if (test(name)) return g;
  return "기타(개별SO)";
}

const CATEGORIES = ["전체", "IPTV", "SO", "PP"];

let companies = [];
let financials = [];
let currentCategory = "전체";
let currentSeries = [];          // 현재 카테고리에서 렌더링 대상인 시리즈(개별 회사 또는 SO 그룹) 목록
let selectedSeriesIds = new Set();
let currentMetric = "매출액";
let currentUnit = 100000; // 억원
let chart = null;

async function initData() {
  const { data: companyData, error: cErr } = await supabase.from('companies').select('*').order('category').order('name');
  const { data: finData, error: fErr } = await supabase.from('financial_yearly').select('*');

  if (cErr || fErr) {
    document.getElementById('emptyMsg').style.display = 'block';
    document.getElementById('emptyMsg').textContent = '데이터 로드 오류: ' + (cErr?.message || fErr?.message);
    return false;
  }
  companies = companyData || [];
  financials = finData || [];
  return true;
}

// 카테고리(전체/IPTV/SO/PP)에 맞는 "시리즈" 목록을 만든다.
// 시리즈 = 차트/표에 한 줄로 나오는 단위. 보통은 회사 1개 = 시리즈 1개지만,
// SO는 계열사 그룹 1개 = 시리즈 1개(구성 회사들의 값을 합산)로 만든다.
function buildSeries(category) {
  if (category === "SO") {
    const buckets = {};
    companies.forEach(c => {
      if (c.category !== "SO" || c.name.endsWith("합계")) return;
      const g = soGroupOf(c.name);
      (buckets[g] = buckets[g] || []).push(c.id);
    });
    const series = SO_GROUP_ORDER.filter(g => buckets[g]).map(g => ({
      id: "grp:" + g, label: g, companyIds: buckets[g]
    }));
    const total = companies.find(c => c.category === "SO" && c.name.endsWith("합계"));
    if (total) series.unshift({ id: "c:" + total.id, label: total.name, companyIds: [total.id] });
    return series;
  }
  const pool = category === "전체" ? companies : companies.filter(c => c.category === category);
  return pool.map(c => ({ id: "c:" + c.id, label: c.name, companyIds: [c.id] }));
}

function renderCategoryRow() {
  const wrap = document.getElementById("categoryRow");
  wrap.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === currentCategory ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = cat;
      currentSeries = buildSeries(currentCategory);
      selectedSeriesIds = new Set(currentSeries.map(s => s.id));
      document.getElementById("groupHint").style.display = cat === "SO" ? "block" : "none";
      renderCategoryRow();
      renderCompanyChips();
      render();
    };
    wrap.appendChild(btn);
  });
}

function renderCompanyChips() {
  const wrap = document.getElementById('companyChips');
  wrap.innerHTML = '';
  currentSeries.forEach((s, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedSeriesIds.has(s.id) ? ' active' : '');
    chip.innerHTML = `<span class="company-color" style="background:${COLORS[i % COLORS.length]}"></span>${s.label}`;
    chip.onclick = () => {
      if (selectedSeriesIds.has(s.id)) { selectedSeriesIds.delete(s.id); chip.classList.remove('active'); }
      else { selectedSeriesIds.add(s.id); chip.classList.add('active'); }
      render();
    };
    wrap.appendChild(chip);
  });
}

async function init() {
  const ok = await initData();
  if (!ok) return;

  currentSeries = buildSeries(currentCategory);
  selectedSeriesIds = new Set(currentSeries.map(s => s.id));

  renderCategoryRow();
  renderCompanyChips();
  renderMetricSelect();
  render();
}

function renderMetricSelect() {
  const sel = document.getElementById('metricSelect');
  sel.innerHTML = '';
  Object.entries(METRIC_GROUPS).forEach(([group, metrics]) => {
    const og = document.createElement('optgroup');
    og.label = group;
    metrics.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      if (m === currentMetric) opt.selected = true;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
  sel.onchange = () => { currentMetric = sel.value; render(); };
}

document.querySelectorAll('.unit-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentUnit = Number(btn.dataset.unit);
    render();
  };
});

function unitLabel() {
  if (currentUnit === 100000) return '억원';
  if (currentUnit === 1000) return '백만원';
  return '천원';
}

function render() {
  renderChart();
  renderTable();
}

// 시리즈(회사 1개 또는 SO 그룹)의 특정 연도·항목 합계값. 구성 회사 중 값이 하나도 없으면 null(빈 구간).
function seriesValue(series, year) {
  let sum = 0, found = false;
  for (const cid of series.companyIds) {
    const row = financials.find(f => f.company_id === cid && f.year === year && f.metric_name === currentMetric);
    if (row) { sum += Number(row.value); found = true; }
  }
  return found ? sum : null;
}

function renderChart() {
  const ctx = document.getElementById('trendChart');
  const years = [...new Set(financials.map(f => f.year))].sort();
  const selected = currentSeries.filter(s => selectedSeriesIds.has(s.id));

  const datasets = selected.map((s, i) => {
    const colorIdx = currentSeries.indexOf(s);
    const data = years.map(y => {
      const v = seriesValue(s, y);
      return v === null ? null : v / currentUnit;
    });
    return {
      label: s.label,
      data,
      borderColor: COLORS[colorIdx % COLORS.length],
      backgroundColor: COLORS[colorIdx % COLORS.length] + '22',
      tension: 0.25,
      spanGaps: true,
    };
  });

  const catLabel = currentCategory === '전체' ? '' : `[${currentCategory}] `;
  document.getElementById('chartTitle').textContent = `${catLabel}${currentMetric} 연도별 추이 (단위: ${unitLabel()})`;

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: years, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { ticks: { callback: v => v.toLocaleString() } } }
    }
  });
}

// 표는 "사업자별 1행 + 연도별 열"로 피벗해서, 한 사업자의 연도별 흐름을 한 줄에서 바로 볼 수 있게 한다.
function renderTable() {
  const thead = document.getElementById('dataTableHead');
  const tbody = document.getElementById('dataTableBody');
  const years = [...new Set(financials.map(f => f.year))].sort();
  const selected = currentSeries.filter(s => selectedSeriesIds.has(s.id));

  document.getElementById('tableTitle').textContent =
    `전체 데이터 · ${currentMetric} (단위: ${unitLabel()})`;

  thead.innerHTML = '<th>사업자</th><th>구분</th>' + years.map(y => `<th>${y}</th>`).join('');

  tbody.innerHTML = '';
  let anyRow = false;

  selected.forEach(s => {
    const values = years.map(y => seriesValue(s, y));
    if (values.every(v => v === null)) return; // 데이터가 하나도 없는 사업자는 표에서 생략
    anyRow = true;
    const tr = document.createElement('tr');
    const catCell = currentCategory === '전체' ? '' : currentCategory;
    const valueCells = values.map(v =>
      `<td>${v === null ? '-' : (v / currentUnit).toLocaleString(undefined, { maximumFractionDigits: 1 })}</td>`
    ).join('');
    tr.innerHTML = `<td>${s.label}</td><td>${catCell}</td>${valueCells}`;
    tbody.appendChild(tr);
  });

  document.getElementById('emptyMsg').style.display = anyRow ? 'none' : 'block';
}

init();
</script>
</body>
</html>
